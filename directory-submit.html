<!doctype html><html lang="mr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Directory माहिती जोडा | Kurduwadi</title><link rel="stylesheet" href="css/style.css"></head><body class="form-page"><header class="header"><a class="brand" href="index.html"><div class="brand-mark">K</div><div><strong>कुर्डुवाडी</strong><small>CITIZEN DIRECTORY</small></div></a><a class="outline-btn" href="directory.html">← Directory</a></header><main class="form-wrap"><section class="form-intro"><span class="section-label">DIRECTORY SUBMISSION</span><h1>Directory मध्ये माहिती जोडा</h1><p>तुमची माहिती Admin पडताळणीनंतर Directory मध्ये प्रकाशित केली जाईल.</p></section><section class="card"><form id="directoryForm"><label>नाव / व्यवसायाचे नाव *<input id="business_name" required maxlength="120" placeholder="उदा. अमोल किराणा / अमोल पाटील"></label><label>वर्ग / व्यवसाय *<input id="category" required maxlength="80" placeholder="उदा. शिक्षण, व्यवसाय, सेवा"></label><label>मोबाईल क्रमांक<input id="contact_number" maxlength="20" placeholder="मोबाईल नंबर"></label><label>पत्ता<input id="address" maxlength="300" placeholder="कुर्डुवाडी, ..."></label><label>वेळ<input id="timings" maxlength="120" placeholder="उदा. सकाळी 9 ते रात्री 9"></label><label>Google Maps Link (ऐच्छिक)<input id="google_maps_link" type="url" placeholder="https://maps.google.com/..."></label><label><input id="is_public" type="checkbox" checked> माझी माहिती Directory वर सार्वजनिक करण्यास माझी संमती आहे.</label><button class="primary-btn" type="submit">📤 माहिती Submit करा</button><p id="msg" class="muted"></p></form></section></main><script src="js/config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/directory-submit.js"></script></body></html>
