<!doctype html><html lang="mr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="कुर्डूवाडी शहर इतिहास लोकसंख्या आणि माहिती"><title>कुर्डूवाडी माहिती | इतिहास | लोकसंख्या</title><link rel="stylesheet" href="css/style.css"></head><body><header class="header"><a class="brand" href="index.html"><div class="brand-mark">K</div><div><strong>कुर्डूवाडी</strong><small>CITY INFORMATION</small></div></div><a class="outline-btn" href="index.html">← मुख्यपृष्ठ</a></header><main class="section"><span class="section-label">CITY GUIDE</span><h1>🏙️ कुर्डूवाडी माहिती</h1><div id="info" class="detail-grid"></div></main><script src="js/config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient(KURDUWADI_CONFIG.SUPABASE_URL,KURDUWADI_CONFIG.SUPABASE_ANON_KEY);(async()=>{const {data,error}=await db.from('city_info').select('*').eq('status','approved').order('title');document.getElementById('info').innerHTML=error?`<article class="content-card">${esc(error.message)}</article>`:(data||[]).map(x=>`<article class="content-card"><h2>${esc(x.title)}</h2><p>${esc(x.content||'')}</p></article>`).join('')||'<article class="content-card">माहिती उपलब्ध नाही.</article>'})();function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}</script><script src="js/site.js"></script><script src="js/analytics.js"></script>
</body></html>
