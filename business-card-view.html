<!doctype html>
<html lang="mr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="कुर्डूवाडी डिजिटल बिझनेस कार्ड">
<meta name="robots" content="index,follow"><title>डिजिटल बिझनेस कार्ड | कुर्डूवाडी</title>
<link rel="stylesheet" href="css/style.css">
<style>
.bc-page{max-width:760px;margin:34px auto;padding:0 16px}.bc-shell{background:#fff;border-radius:28px;overflow:hidden;box-shadow:0 18px 55px rgba(18,63,122,.16);border:1px solid #e7edf5}.bc-top{background:linear-gradient(135deg,#123f7a,#0d65b5);padding:24px 28px;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:18px}.bc-logo{width:230px;height:auto;border-radius:12px}.bc-kicker{font-size:12px;letter-spacing:2px;font-weight:800;opacity:.85}.bc-body{padding:28px}.bc-profile{display:grid;grid-template-columns:1fr 190px;gap:26px;align-items:center}.bc-name{font-size:38px;line-height:1.1;margin:0;color:#123f7a}.bc-business{font-size:20px;color:#f36f21;font-weight:800;margin:10px 0}.bc-designation{font-weight:700;color:#52657b}.bc-bio{color:#52657b;line-height:1.6}.bc-info{margin-top:22px;display:grid;gap:10px}.bc-info a{color:#123f7a;text-decoration:none;font-weight:700}.bc-row{padding:10px 0;border-bottom:1px solid #edf1f6}.bc-row b{display:inline-block;min-width:95px;color:#60748a}.bc-qrbox{background:#f5f9ff;border:1px solid #d9e7f7;border-radius:20px;padding:16px;text-align:center}.bc-qrbox h3{margin:0 0 8px;color:#123f7a}.bc-qrbox small{display:block;color:#60748a;line-height:1.4}.bc-qr{display:flex;justify-content:center;background:#fff;padding:10px;border-radius:14px}.bc-actions{display:flex;flex-wrap:wrap;gap:10px;margin:22px 0 4px}.bc-actions button,.bc-actions a{border:0;border-radius:12px;padding:12px 16px;font-weight:800;cursor:pointer;text-decoration:none}.bc-download{background:#f36f21;color:#fff}.bc-share{background:#123f7a;color:#fff}.bc-back{background:#eef4fb;color:#123f7a}.bc-footer{background:#0b2e59;color:#fff;padding:16px 22px;display:flex;align-items:center;justify-content:space-between;gap:15px}.bc-footer img{width:180px;background:#fff;border-radius:8px}.bc-footer-text{font-size:12px;line-height:1.5;text-align:right}.bc-card-download{position:fixed;left:-100000px;top:0;width:900px;min-height:520px}.print-card{background:#fff;border-radius:26px;overflow:hidden;border:2px solid #dce8f5;font-family:Arial,sans-serif}.print-head{background:linear-gradient(135deg,#123f7a,#0d65b5);padding:20px 28px;color:#fff;display:flex;justify-content:space-between;align-items:center}.print-head img{width:300px;background:#fff;border-radius:10px}.print-badge{font-weight:800;letter-spacing:1px}.print-main{padding:28px;display:grid;grid-template-columns:1fr 210px;gap:24px}.print-main h1{font-size:42px;color:#123f7a;margin:4px 0}.print-main h2{color:#f36f21;margin:8px 0}.print-main p{color:#52657b;line-height:1.5}.print-contact{font-size:17px;line-height:1.9;color:#183b63}.print-qr{text-align:center;background:#f5f9ff;border-radius:18px;padding:14px}.print-qr h3{color:#123f7a}.print-footer{background:#0b2e59;color:#fff;padding:13px 25px;display:flex;justify-content:space-between;align-items:center}.print-footer img{width:190px;background:#fff;border-radius:7px}.print-footer span{font-weight:700}
@media(max-width:650px){.bc-top{flex-direction:column;align-items:flex-start}.bc-logo{width:210px}.bc-profile{grid-template-columns:1fr}.bc-name{font-size:31px}.bc-footer{flex-direction:column;align-items:flex-start}.bc-footer-text{text-align:left}.print-main{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="header"><a class="brand" href="index.html"><div class="brand-mark">K</div><div><strong>कुर्डूवाडी</strong><small>DIGITAL BUSINESS CARD</small></div></a><a class="outline-btn" href="index.html">← मुख्यपृष्ठ</a></header>
<main class="bc-page"><div id="card" class="bc-shell"><div class="bc-body"><p>कार्ड शोधत आहे...</p></div></div></main>
<div id="downloadArea" class="bc-card-download" aria-hidden="true"></div>
<script src="js/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="js/site.js"></script><script src="js/analytics.js"></script>
<script>
const cfg=window.KURDUWADI_CONFIG;const db=supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);const slug=new URLSearchParams(location.search).get('slug');
const siteUrl=(cfg.SITE_URL||location.origin+'/').replace(/\/$/,'')+'/';
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function safeUrl(v){try{const u=new URL(v);return ['http:','https:'].includes(u.protocol)?u.href:'#'}catch{return '#'}}
function tel(v){return String(v||'').replace(/[^\d+]/g,'')}
function wa(v){return String(v||'').replace(/\D/g,'')}
async function buildDownloadCard(data){
 const area=document.getElementById('downloadArea');
 area.innerHTML=`<div id="printCard" class="print-card"><div class="print-head"><img src="assets/kurduwadi-logo.svg" alt="Kurduwadi City Portal"><span class="print-badge">DIGITAL BUSINESS CARD</span></div><div class="print-main"><div><h1>${esc(data.name)}</h1><h2>${esc(data.business_name||'')}</h2><p><strong>${esc(data.designation||'')}</strong></p><p>${esc(data.bio||'')}</p><div class="print-contact">${data.phone?`📞 ${esc(data.phone)}<br>`:''}${data.whatsapp?`🟢 WhatsApp: ${esc(data.whatsapp)}<br>`:''}${data.email?`✉ ${esc(data.email)}<br>`:''}${data.address?`📍 ${esc(data.address)}`:''}</div></div><div class="print-qr"><h3>Scan to Visit</h3><div id="downloadQr"></div><small>कुर्डूवाडी सिटी पोर्टलला भेट द्या</small></div></div><div class="print-footer"><span>Powered by Kurduwadi City Portal</span><img src="assets/kurduwadi-logo.svg" alt="Kurduwadi City Portal"></div></div>`;
 await new Promise(r=>setTimeout(r,50));
 new QRCode(document.getElementById('downloadQr'),{text:siteUrl,width:160,height:160,colorDark:'#111',colorLight:'#fff'});
 return document.getElementById('printCard');
}
async function downloadCard(data){
 const card=await buildDownloadCard(data);const canvas=await html2canvas(card,{scale:2,useCORS:true,backgroundColor:'#ffffff',logging:false});const a=document.createElement('a');a.download=(data.name||'business-card').replace(/[^\w\u0900-\u097F-]+/g,'-')+'-kurduwadi-card.png';a.href=canvas.toDataURL('image/png');a.click();
}
async function shareCard(data){const url=location.href;if(navigator.share){try{await navigator.share({title:(data.name||'Digital Business Card')+' | Kurduwadi City Portal',text:'डिजिटल बिझनेस कार्ड',url});}catch(e){}}else{await navigator.clipboard?.writeText(url);alert('✅ कार्डची लिंक कॉपी झाली.');}}
(async()=>{const el=document.getElementById('card');if(!slug){el.innerHTML='<div class="bc-body"><h2>कार्ड सापडले नाही</h2></div>';return}const {data,error}=await db.from('business_cards').select('*').eq('slug',slug).eq('status','approved').maybeSingle();if(error||!data){el.innerHTML='<div class="bc-body"><h2>कार्ड सापडले नाही</h2><p>कृपया योग्य public card link वापरा.</p></div>';return}document.title=(data.name||'Digital Card')+' | कुर्डूवाडी';
 el.innerHTML=`<div class="bc-top"><img class="bc-logo" src="assets/kurduwadi-logo.svg" alt="Kurduwadi City Portal"><span class="bc-kicker">DIGITAL BUSINESS CARD</span></div><div class="bc-body"><div class="bc-profile"><div><h1 class="bc-name">${esc(data.name)}</h1><div class="bc-business">${esc(data.business_name||'')}</div><div class="bc-designation">${esc(data.designation||'')}</div><p class="bc-bio">${esc(data.bio||'')}</p><div class="bc-info">${data.phone?`<div class="bc-row"><b>📞 मोबाईल</b><a href="tel:${esc(tel(data.phone))}">${esc(data.phone)}</a></div>`:''}${data.whatsapp?`<div class="bc-row"><b>🟢 WhatsApp</b><a href="https://wa.me/${esc(wa(data.whatsapp))}" target="_blank" rel="noopener">${esc(data.whatsapp)}</a></div>`:''}${data.email?`<div class="bc-row"><b>✉ Email</b><a href="mailto:${esc(data.email)}">${esc(data.email)}</a></div>`:''}${data.address?`<div class="bc-row"><b>📍 पत्ता</b><span>${esc(data.address)}</span></div>`:''}${data.website?`<div class="bc-row"><b>🌐 Website</b><a href="${esc(safeUrl(data.website))}" target="_blank" rel="noopener">Website उघडा</a></div>`:''}</div></div><div class="bc-qrbox"><h3>Scan to Visit</h3><div id="qrcode" class="bc-qr"></div><small>हा QR स्कॅन करून<br><strong>Kurduwadi City Portal</strong> ला भेट द्या.</small></div></div><div class="bc-actions"><button class="bc-download" id="downloadBtn">⬇️ Download Card</button><button class="bc-share" id="shareBtn">↗️ Share Card</button><a class="bc-back" href="index.html">मुख्यपृष्ठ</a></div></div><div class="bc-footer"><img src="assets/kurduwadi-logo.svg" alt="Kurduwadi City Portal"><div class="bc-footer-text">आपले शहर • आपली माहिती • आपला डिजिटल प्लॅटफॉर्म<br><strong>www.kurduwadicityportal.in</strong></div></div>`;
 new QRCode(document.getElementById('qrcode'),{text:siteUrl,width:180,height:180,colorDark:'#111',colorLight:'#fff'});
 document.getElementById('downloadBtn').onclick=()=>downloadCard(data);document.getElementById('shareBtn').onclick=()=>shareCard(data);
})();
</script>
</body></html>
