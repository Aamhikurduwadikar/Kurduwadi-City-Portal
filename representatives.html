<!doctype html><html lang="mr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="कुर्डूवाडी लोकप्रतिनिधी माहिती"><title>लोकप्रतिनिधी | कुर्डूवाडी</title><link rel="stylesheet" href="css/style.css"></head><body><header class="header"><a class="brand" href="index.html"><div class="brand-mark">K</div><div><strong>कुर्डूवाडी</strong><small>PUBLIC REPRESENTATIVES</small></div></div><a class="outline-btn" href="index.html">← मुख्यपृष्ठ</a></header><main class="section"><span class="section-label">PUBLIC REPRESENTATIVES</span><h1>🏛️ लोकप्रतिनिधी</h1><p class="muted">Admin कडून पडताळलेली माहिती.</p><div id="reps" class="service-grid"><div class="content-card">माहिती loading...</div></div></main><script src="js/config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const db=supabase.createClient(KURDUWADI_CONFIG.SUPABASE_URL,KURDUWADI_CONFIG.SUPABASE_ANON_KEY);(async()=>{const {data,error}=await db.from('representatives').select('*').eq('status','approved').order('name');document.getElementById('reps').innerHTML=error?`<div class="content-card">${esc(error.message)}</div>`:data.length?data.map(r=>`<article class="content-card"><span class="icon navy">🏛️</span><h2>${esc(r.name)}</h2><p><b>${esc(r.role||'')}</b>${r.ward?' • '+esc(r.ward):''}</p><p>${esc(r.description||'')}</p>${r.phone?`<p>☎️ ${esc(r.phone)}</p>`:''}${r.office_address?`<p>📍 ${esc(r.office_address)}</p>`:''}</article>`).join(''):'<div class="content-card">अद्याप माहिती उपलब्ध नाही.</div>'})();function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}</script><script src="js/site.js"></script><script src="js/analytics.js"></script>
</body></html>
