<!doctype html>
<html lang="mr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="कुर्डूवाडी लोकप्रतिनिधी माहिती">
<title>लोकप्रतिनिधी | कुर्डूवाडी</title>
<link rel="stylesheet" href="css/style.css">
<style>
.rep-page{max-width:1180px;margin:auto;padding:32px 18px 70px}.rep-head{text-align:center;margin-bottom:28px}.rep-head .section-label{letter-spacing:.12em}.rep-head h1{font-size:clamp(30px,5vw,48px);margin:10px 0 8px}.rep-head p{color:#64748b;margin:0}.rep-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,380px));justify-content:center;gap:22px}.rep-card{position:relative;overflow:hidden;border:1px solid rgba(15,23,42,.09);border-radius:24px;background:linear-gradient(145deg,#fff,#f8fafc);box-shadow:0 14px 40px rgba(15,23,42,.10);padding:0;transition:transform .2s ease,box-shadow .2s ease}.rep-card:hover{transform:translateY(-4px);box-shadow:0 20px 50px rgba(15,23,42,.14)}.rep-top{height:7px;background:linear-gradient(90deg,#0f172a,#2563eb,#16a34a)}.rep-photo-wrap{padding:24px 24px 8px;text-align:center}.rep-photo{width:150px;height:150px;border-radius:50%;object-fit:cover;border:5px solid #fff;box-shadow:0 8px 26px rgba(15,23,42,.18);background:#e2e8f0}.rep-body{padding:8px 24px 24px;text-align:center}.rep-role{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:#ecfdf5;color:#166534;font-weight:800;font-size:14px;margin:5px 0 12px}.rep-name{font-size:25px;line-height:1.2;margin:0 0 9px;color:#0f172a}.rep-place{font-weight:700;color:#334155;margin:0 0 12px}.rep-party{display:inline-block;padding:7px 11px;border-radius:10px;background:#f1f5f9;color:#334155;font-size:13px;line-height:1.4}.rep-desc{color:#64748b;line-height:1.6;margin:14px 0}.rep-actions{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:16px}.rep-btn{display:inline-flex;align-items:center;justify-content:center;min-height:42px;padding:0 14px;border-radius:12px;text-decoration:none;font-weight:800;border:1px solid #e2e8f0;background:#fff;color:#0f172a}.rep-btn.primary{background:#0f172a;color:#fff;border-color:#0f172a}.rep-btn:hover{opacity:.9}.rep-source{font-size:12px;color:#94a3b8;margin-top:16px}.rep-empty{max-width:520px;margin:20px auto;padding:28px;border:1px dashed #cbd5e1;border-radius:18px;text-align:center;color:#64748b}.rep-footer{text-align:center;color:#94a3b8;font-size:12px;margin-top:38px}@media(max-width:600px){.rep-page{padding-top:22px}.rep-card{border-radius:20px}.rep-photo{width:132px;height:132px}.rep-body{padding:8px 18px 20px}.rep-name{font-size:22px}.rep-actions{display:grid;grid-template-columns:1fr 1fr}.rep-btn{width:100%}}
</style>
</head>
<body>
<header class="header"><a class="brand" href="index.html"><div class="brand-mark">K</div><div><strong>कुर्डूवाडी</strong><small>PUBLIC REPRESENTATIVES</small></div></a><a class="outline-btn" href="index.html">← मुख्यपृष्ठ</a></header>
<main class="rep-page">
<section class="rep-head"><span class="section-label">PUBLIC REPRESENTATIVES</span><h1>🏛️ लोकप्रतिनिधी</h1><p>कुर्डूवाडी व माढा परिसरातील लोकप्रतिनिधींची पडताळलेली सार्वजनिक माहिती.</p></section>
<section id="reps" class="rep-grid"><div class="rep-empty">माहिती loading...</div></section>
<p class="rep-footer">माहिती उपलब्ध सार्वजनिक/अधिकृत स्रोतांवर आधारित आहे. अधिकृत संपर्कासाठी संबंधित शासकीय स्रोत तपासा.</p>
</main>
<script src="js/config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const cfg=window.KURDUWADI_CONFIG||{};const db=supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_ANON_KEY);const root=document.getElementById('reps');
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function url(v){const s=String(v||'').trim();return /^https?:\\/\\//i.test(s)?s:''}
function phoneUrl(v){const n=String(v||'').replace(/\\D/g,'');return n?(n.length===10?'91'+n:n):''}
(async()=>{const {data,error}=await db.from('representatives').select('*').eq('status','approved').order('name');if(error){root.innerHTML='<div class="rep-empty">माहिती लोड करताना अडचण आली.</div>';return}if(!data?.length){root.innerHTML='<div class="rep-empty">अद्याप लोकप्रतिनिधी माहिती उपलब्ध नाही.</div>';return}root.innerHTML=data.map(r=>{const photo=url(r.photo_url);const site=url(r.social_url);const ph=phoneUrl(r.phone);return `<article class="rep-card"><div class="rep-top"></div><div class="rep-photo-wrap">${photo?`<img class="rep-photo" src="${esc(photo)}" alt="${esc(r.name)}" loading="lazy">`:'<div class="rep-photo" aria-hidden="true">🏛️</div>'}</div><div class="rep-body"><span class="rep-role">🏛️ ${esc(r.role||'लोकप्रतिनिधी')}</span><h2 class="rep-name">${esc(r.name)}</h2>${r.ward?`<p class="rep-place">📍 ${esc(r.ward)}</p>`:''}${r.party?`<div class="rep-party">${esc(r.party)}</div>`:''}${r.description?`<p class="rep-desc">${esc(r.description)}</p>`:''}<div class="rep-actions">${ph?`<a class="rep-btn primary" href="tel:+${ph}">📞 संपर्क</a>`:''}${r.email?`<a class="rep-btn" href="mailto:${esc(r.email)}">✉️ ई-मेल</a>`:''}${site?`<a class="rep-btn" href="${esc(site)}" target="_blank" rel="noopener">🌐 अधिकृत माहिती</a>`:''}${r.office_address?`<a class="rep-btn" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(r.office_address)}" target="_blank" rel="noopener">📍 ठिकाण</a>`:''}</div>${site?'<div class="rep-source">अधिकृत माहितीचा स्रोत उपलब्ध</div>':''}</div></article>`}).join('')})();
</script>
<script src="js/site.js"></script><script src="js/analytics.js"></script>
</body></html>
